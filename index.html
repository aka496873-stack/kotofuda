<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="コトフダ：配られた言葉の札だけでお題に答える、1台回しのパーティーゲーム。2〜8人で遊べます。">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>コトフダ ～配られた言葉で笑わせろ～｜1台で遊べる大喜利パーティーゲーム</title>
<meta name="description" content="配られた言葉の札だけで答える大喜利ゲーム。スマホ1台を回して、登録なし・無料ですぐ遊べます。">
<meta property="og:title" content="コトフダ ～配られた言葉で笑わせろ～">
<meta property="og:description" content="配られた言葉の札だけで答える、1台回しの大喜利パーティーゲーム。">
<meta property="og:url" content="https://aka496873-stack.github.io/kotofuda/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一台を回して遊ぶ進行型。上に進行の段とやめるボタン、下にその段の画面を一枚。回答は「手札」から「回答欄」へ言葉の札を動かして組み立てる。 */
:root{
  --paper:#f1efe9; --sheet:#ffffff; --ink:#22232b; --ink-soft:#62646f;
  --line:#dcd9d0; --accent:#e2462f; --accent-ink:#ffffff; --chip:#ece9e1;
  --easy-bg:#dcf2df; --easy-bd:#2f8a52; --norm-bg:#fff6d6; --norm-bd:#22232b; --hard-bg:#ebe2fb; --hard-bd:#6b47b8;
  --pal-bg:#f4f3ef; --pal-bd:#b9b6ad; --slot:#f7f6f2;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15161b; --sheet:#1e2027; --ink:#ececf1; --ink-soft:#a0a2ad;
  --line:#33353f; --accent:#ff6a52; --accent-ink:#1a0b08; --chip:#2a2c35;
  --easy-bg:#1d3a27; --easy-bd:#5cc985; --norm-bg:#3a3420; --norm-bd:#d8d2bd; --hard-bg:#2f2547; --hard-bd:#a98af0;
  --pal-bg:#26282f; --pal-bd:#4a4c57; --slot:#191b21; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15161b; --sheet:#1e2027; --ink:#ececf1; --ink-soft:#a0a2ad;
  --line:#33353f; --accent:#ff6a52; --accent-ink:#1a0b08; --chip:#2a2c35;
  --easy-bg:#1d3a27; --easy-bd:#5cc985; --norm-bg:#3a3420; --norm-bd:#d8d2bd; --hard-bg:#2f2547; --hard-bd:#a98af0;
  --pal-bg:#26282f; --pal-bd:#4a4c57; --slot:#191b21; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:.04em}
h1 .subtitle{display:block;font-family:var(--f-ui);font-weight:700;font-size:clamp(13px,2.6vw,16px);letter-spacing:.08em;color:var(--ink-soft);margin-top:2px}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,4vw,24px);margin:0 0 4px;text-wrap:balance}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:12px}
.steps li{padding:3px 10px;border-radius:999px;color:var(--ink-soft);border:1px solid var(--line)}
.steps li.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps li.done{color:var(--ink)}
.quitbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:6px;padding:10px 14px;font-size:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.lead{color:var(--ink-soft);margin:0}
.label{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);margin:0}
button,select{font-family:var(--f-ui);font-size:15px;border-radius:6px;cursor:pointer}
button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 18px;font-weight:500}
button:hover{background:var(--chip)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover:not(:disabled){filter:brightness(1.05);background:var(--accent)}
button.ghost{border-color:var(--line);color:var(--ink-soft);font-size:13px;padding:5px 12px}
button.quit-btn{border:2px solid var(--accent);color:var(--accent);background:var(--sheet);font-weight:700;font-size:14px;padding:7px 14px;display:inline-flex;gap:6px;align-items:center}
button.quit-btn:hover{background:var(--accent);color:var(--accent-ink)}
button.danger{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 10px;border-radius:6px;font-family:var(--f-ui);font-size:15px}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.names label,.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-soft)}
.field input{width:100%}
.theme{background:var(--ink);color:var(--paper);border-radius:8px;padding:18px 22px;display:flex;flex-direction:column;gap:2px}
.theme .label{color:var(--paper);opacity:.7}
.theme .txt{font-family:var(--f-display);font-size:clamp(22px,5vw,32px);line-height:1.35;text-wrap:balance}
.theme.small .txt{font-size:clamp(17px,3.6vw,21px)}
.roulette{position:relative}
.roulette .slot{overflow:hidden;min-height:2.8em;display:flex;align-items:center;border-top:1px dashed color-mix(in srgb,var(--paper) 35%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--paper) 35%,transparent);padding-block:6px;margin-top:4px}
.roulette .slot::before{content:"▶";color:var(--accent);margin-right:10px;font-size:18px}
.roulette .txt.roll{animation:roll .12s ease-out}
.roulette.spinning .txt{opacity:.75}
.roulette.landed .txt{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
.roulette.landed{box-shadow:0 0 0 3px var(--accent)}
@keyframes roll{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes land{0%{transform:scale(.85)}100%{transform:none}}
/* 言葉の札 */
.tiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.t{font-weight:700;font-size:17px;line-height:1.3;padding:6px 12px;border-radius:6px;border:1.5px solid var(--norm-bd);background:var(--norm-bg);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;transition:opacity .12s}
.t.e{background:var(--easy-bg);border-color:var(--easy-bd)}
.t.h{background:var(--hard-bg);border-color:var(--hard-bd)}
.t.w{background:var(--sheet);border:2px dashed var(--accent)}
.t.fresh{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.t.sel{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-3px)}
.wild{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wild input{flex:1;min-width:160px}
.t.p{background:var(--pal-bg);border-color:var(--pal-bd);font-size:16px;padding:5px 10px;min-width:34px;text-align:center}
.t.gone{opacity:.22;cursor:default}
.t.dragging{opacity:.3}
.ghost-tile{position:fixed;pointer-events:none;z-index:20;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.answer{min-height:96px;border:2px dashed var(--line);border-radius:8px;background:var(--slot);padding:12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.answer.over{border-color:var(--accent)}
.answer .empty{color:var(--ink-soft);font-size:14px;align-self:center}
.caret{width:3px;align-self:stretch;min-height:30px;background:var(--accent);border-radius:2px}
.preview{font-size:18px;font-weight:700;min-height:1.6em;word-break:break-word}
.preview.dim{color:var(--ink-soft);font-weight:400;font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);align-items:center}
.legend .t{font-size:12px;padding:1px 8px;cursor:default}
.mini .t{font-size:13px;padding:2px 8px;border-width:1px;cursor:default}
.mini .t.p{font-size:13px;padding:2px 5px;min-width:0}
.mini .t.unused{opacity:.4}
/* 計時 */
.timer{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--f-display);font-size:40px;font-variant-numeric:tabular-nums;min-width:2.4ch;line-height:1}
.clock.low{color:var(--accent)}
.bar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.bar i.low{background:var(--accent)}
.pass{align-items:center;text-align:center;padding-block:48px}
.intro{margin-bottom:18px}
.howto{margin:0;padding:0;list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:10px}
.howto li{counter-increment:step;display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:10px;color:var(--ink-soft);font-size:14px}
.howto li::before{content:counter(step);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.howto li b{color:var(--ink);font-size:15px}
.pass .who{font-family:var(--f-display);font-size:clamp(28px,7vw,42px)}
/* 回答カード */
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ans{border:1.5px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sheet);position:relative;min-width:0}
.ans .num{font-size:12px;color:var(--ink-soft)}
.ans .body{font-size:19px;font-weight:700;line-height:1.55;margin:0;word-break:break-word}
.ans .body.blank{color:var(--ink-soft);font-weight:400}
.ans .meta{font-size:12px;color:var(--ink-soft)}
.ans.pickable{cursor:pointer}
.ans.pickable:hover{border-color:var(--ink)}
.ans.picked{border:2.5px solid var(--accent)}
.ans.self{opacity:.4;cursor:not-allowed}
.ans.win{border:2.5px solid var(--accent)}
.ans.win::after{content:"優勝";position:absolute;right:12px;top:-11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px}
.ans .foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;gap:8px}
.ans .author{font-weight:700}
.ans .votes{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.ans .votes small{font-family:var(--f-ui);font-size:12px;color:var(--ink-soft)}
.champion{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.champion .who{font-family:var(--f-display);font-size:clamp(28px,7vw,40px)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink-soft);font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>コトフダ<span class="subtitle">～配られた言葉で笑わせろ～</span></h1>
    <div class="top-right">
      <ol class="steps" id="steps"></ol>
      <button class="quit-btn" id="quit" type="button" hidden><span aria-hidden="true">✕</span> ゲームをやめる</button>
    </div>
  </header>
  <div class="quitbar" id="quitbar" hidden>
    <span>ゲームをやめますか？ 進行中の回答と投票は消え、最終成績を発表します。</span>
    <button class="danger" id="quit-yes" type="button">やめる</button>
    <button id="quit-no" type="button">続ける</button>
  </div>
  <main id="screen"></main>
</div>
<div class="toast" id="toast" hidden></div>

const TOPIC_FALLBACK="本当に 実は ついに 絶対に 伝説 運命 最強 秘密 奇跡 ありがとう 正直 まさか";
/* 優先順：お題専用の言葉 → 題材グループの言葉 → 汎用。deal()は配列の末尾から取る */
function relatedWords(theme){
  const own=THEME_WORDS[theme]||[],group=new Set();
  TOPICS.forEach(([re,ws])=>{if(re.test(theme))ws.split(" ").forEach(w=>group.add(w));});
  own.forEach(w=>group.delete(w));
  const fb=TOPIC_FALLBACK.split(" ").filter(w=>!own.includes(w)&&!group.has(w));
  return [...shuffled(fb),...shuffled([...group]),...shuffled(own)];
}

const TIER_OF={};["e","n","h"].forEach(t=>WORDS[t].forEach(w=>TIER_OF[w]=t));
const RELATED_PER_PLAYER=2;
/* 言葉を配る：一人2枚はお題に合いそうな言葉、残りはランダム。プレイヤー間で重複なし */
function deal(){
  const related=relatedWords(G.theme),taken=new Set();
  const hands=G.players.map(()=>{
    const hand=[];
    while(hand.length<RELATED_PER_PLAYER&&related.length){const w=related.pop();if(taken.has(w))continue;taken.add(w);hand.push({w,tier:TIER_OF[w]||"n"});}
    return hand;
  });
  G.pools={e:shuffled(WORDS.e).filter(w=>!taken.has(w)),n:shuffled(WORDS.n).filter(w=>!taken.has(w)),h:shuffled(WORDS.h).filter(w=>!taken.has(w))};
  G.mix=G.players.map(()=>({e:swing(MIX_BASE.e),h:swing(MIX_BASE.h)}));
  G.wild=G.players.map(()=>false);
  return hands.map((hand,i)=>{
    while(hand.length<G.perPlayer)hand.push(drawTile(i));
    return shuffled(hand);
  });
}
/* 山札から1枚引く（その人の割合で） */
function drawTile(i){
  const {e,h}=G.mix[i],r=Math.random();let tier=r<e?"e":r<e+h?"h":"n";
  if(!G.pools[tier].length)tier="n";
  return {w:G.pools[tier].pop(),tier};
}

/* 進行 */
function go(phase){G.phase=phase;stopTimer();$("quitbar").hidden=true;render();window.scrollTo({top:0});}
function group(){return {pass:"write",shuffle:"write",revealPass:"reveal",votePass:"vote"}[G.phase]||G.phase;}
function render(){
  const idx=STEPS.findIndex(s=>s[0]===group());
  $("steps").innerHTML=STEPS.map((s,i)=>`<li class="${i===idx?"now":i<idx?"done":""}">${s[1]}</li>`).join("");
  $("quit").hidden=(G.phase==="setup"&&!G.round)||G.phase==="finale";
  ({setup,odai,pass,shuffle,write,revealPass,reveal,votePass,vote,result,finale})[G.phase]();
}

      ${G.round?`<div class="who">${champs.map(esc).join("・")}</div><p class="lead">${champs.length>1?"同率で":""}総合優勝　${top}回優勝</p>`:`<div class="who">勝負なし</div><p class="lead">まだ1回戦も終わっていませんでした。</p>`}</div>

}

/* ② お題（ルーレット） */
function newTheme(){let t;do{t=rand(THEMES)}while(t===G.theme);G.theme=t;G.themeCustom=false;G.spin=true;}
let spinId=0;
function lockOdai(on){["reroll","start","custom"].forEach(id=>{const el=$(id);if(el)el.disabled=on;});}
function spin(){
  G.spin=false;
  const txt=$("theme-txt"),box=$("roulette"),id=++spinId,final=G.theme;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){txt.textContent=final;return;}
  lockOdai(true);box.classList.add("spinning");box.classList.remove("landed");
  const steps=22;let n=0;
  const next=()=>{
    if(id!==spinId)return;
    n++;
    const show=n>=steps?final:rand(THEMES);
    txt.textContent=show;
    txt.classList.remove("roll");void txt.offsetWidth;txt.classList.add("roll");
    if(n>=steps){box.classList.remove("spinning");box.classList.add("landed");lockOdai(false);return;}
    const k=n/steps;setTimeout(next,40+Math.pow(k,3)*420);
  };
  next();
}

function shuffle(){
  const MAX_SWAP=G.swapMax;
  const hand=G.hands[G.turn],sel=new Set();
  $("screen").innerHTML=`<section class="sheet">
    <div class="row-flex" style="justify-content:space-between"><h2 style="margin:0">${esc(name(G.turn))}さんのシャッフルタイム</h2><span class="label">${G.turn+1} / ${G.players.length}</span></div>
    <div class="theme small"><span class="label">お題</span><span class="txt">${esc(G.theme)}</span></div>
    <div class="timer"><span class="clock" id="clock">${G.shuffleLimit}</span><div class="bar"><i id="bar" style="width:100%"></i></div></div>
    <p class="lead">交換したい札をタップして選んでください（最大${MAX_SWAP}枚）。選んだ札は山札の別の言葉に替わります。交換できるのは1回だけです。時間切れになると、その時点で選んでいる札を交換して回答に進みます。</p>
    <div class="tiles" id="sh"></div>
    ${legendHTML()}
    <div class="row-flex"><button class="primary" id="swap" type="button" disabled>選んだ札を交換して回答へ</button><button id="noswap" type="button">交換せずに回答へ</button><span class="label" id="selc">0 / ${MAX_SWAP}枚</span></div>
  </section>`;
  const draw=()=>{
    $("sh").innerHTML=hand.map((h,i)=>`<span class="t ${h.tier}${sel.has(i)?" sel":""}" data-i="${i}" tabindex="0" role="button" aria-pressed="${sel.has(i)}">${esc(h.w)}</span>`).join("");
    $("sh").querySelectorAll(".t").forEach(el=>{
      const t=()=>{const i=+el.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<MAX_SWAP)sel.add(i);else{toast(`交換できるのは${MAX_SWAP}枚までです`);return;}draw();};
      el.onclick=t;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}};
      el.style.cursor="pointer";el.style.touchAction="auto";
    });
    $("swap").disabled=!sel.size;$("selc").textContent=`${sel.size} / ${MAX_SWAP}枚`;
  };
  draw();
  const doSwap=timeout=>{
    stopTimer();
    hand.forEach(h=>delete h.fresh);
    sel.forEach(i=>{const t=drawTile(G.turn);t.fresh=true;hand[i]=t;});
    toast(timeout?(sel.size?`時間切れ。${sel.size}枚を交換しました`:"時間切れ。交換せずに回答へ進みます"):`${sel.size}枚を交換しました`);
    go("write");
  };
  $("swap").onclick=()=>doSwap(false);
  $("noswap").onclick=()=>{stopTimer();go("write");};
  startClock(G.shuffleLimit,()=>doSwap(true));
}

let timer=null,deadline=0,cur=[];
function stopTimer(){clearInterval(timer);timer=null;}
function write(){
  cur=[];
  $("screen").innerHTML=`<section class="sheet">
    <div class="row-flex" style="justify-content:space-between"><h2 style="margin:0">${esc(name(G.turn))}さんの回答</h2><span class="label">${G.turn+1} / ${G.players.length}</span></div>
    <div class="timer"><span class="clock" id="clock">${G.limit}</span><div class="bar"><i id="bar" style="width:100%"></i></div></div>
    <div class="theme small"><span class="label">お題</span><span class="txt">${esc(G.theme)}</span></div>
    <div><p class="label" style="margin-bottom:6px">回答欄　札をタップすると戻ります。ドラッグで並べ替えできます。</p>
      <div class="answer" id="answer"></div></div>
    <div class="preview dim" id="preview">ここに文章ができあがります</div>
    <div><p class="label" style="margin-bottom:6px">あなたの手札（タップで回答欄の最後に追加、ドラッグで好きな位置へ）</p><div class="tiles" id="hand"></div></div>
    ${G.glue?`<div><p class="label" style="margin-bottom:6px" id="glue-label"></p><div class="tiles" id="pal"></div></div>`:""}
    ${G.wildOn?`<div><p class="label" style="margin-bottom:6px">救済の自由札（1人1回だけ、好きな言葉を1枚追加できます）</p>
      <div class="wild" id="wild">${G.wild[G.turn]?'<span class="lead">使用済みです</span>':`<input id="wild-in" type="text" maxlength="12" placeholder="追加したい言葉（12字まで）" autocomplete="off" aria-label="自由札の言葉"><button id="wild-add" type="button">手札に追加</button>`}</div></div>`:""}
    ${legendHTML()}
    <div class="row-flex"><button id="undo" type="button">最後の札を戻す</button><button id="clear" type="button">全部戻す</button><button class="primary" id="done" type="button">これで提出する</button></div>
  </section>`;
  drawBuilder();
  $("undo").onclick=()=>{cur.pop();drawBuilder();};
  $("clear").onclick=()=>{cur=[];drawBuilder();};
  $("done").onclick=()=>submit(false);
  if(G.wildOn&&!G.wild[G.turn]){
    const add=()=>{
      const v=$("wild-in").value.trim();
      if(!v){toast("追加したい言葉を入れてください");return;}
      G.hands[G.turn].push({w:v,tier:"w"});G.wild[G.turn]=true;
      $("wild").innerHTML='<span class="lead">自由札を手札に追加しました</span>';drawBuilder();
    };
    $("wild-add").onclick=add;
    $("wild-in").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();add();}};
  }
  startClock(G.limit,()=>submit(true));
}
function startClock(sec,onEnd){
  stopTimer();deadline=Date.now()+sec*1000;
  timer=setInterval(()=>{
    const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    const c=$("clock"),b=$("bar");if(!c)return;
    c.textContent=left;c.classList.toggle("low",left<=10);
    b.style.width=Math.max(0,(deadline-Date.now())/(sec*1000)*100)+"%";b.classList.toggle("low",left<=10);
    if(left<=0){stopTimer();onEnd();}
  },250);
}
function drawBuilder(){
  const hand=G.hands[G.turn],usedIdx=new Set(cur.filter(c=>c.hi!=null).map(c=>c.hi));
  $("hand").innerHTML=hand.map((h,i)=>`<span class="t ${h.tier}${h.fresh?" fresh":""}${usedIdx.has(i)?" gone":""}" data-src="hand" data-hi="${i}" ${usedIdx.has(i)?"":'tabindex="0"'}>${esc(h.w)}</span>`).join("");
  $("answer").innerHTML=cur.length?cur.map((c,i)=>`<span class="t ${c.tier}" data-src="ans" data-ai="${i}" tabindex="0">${esc(c.w)}</span>`).join(""):'<span class="empty">手札の札をここに入れて文章を作ります</span>';
  if(G.glue){
    const left=G.glue-glueUsed();
    $("glue-label").textContent=`つなぎ札（どれでも合計${G.glue}枚まで・残り${left}枚）`;
    $("pal").innerHTML=PALETTE.map((w,i)=>`<span class="t p${left<=0?" gone":""}" data-src="pal" data-pi="${i}" ${left<=0?"":'tabindex="0"'}>${esc(w)}</span>`).join("");
  }
  const txt=joinTiles(cur);
  $("preview").textContent=txt||"ここに文章ができあがります";
  $("preview").classList.toggle("dim",!txt);
  document.querySelectorAll("#hand .t:not(.gone), #pal .t:not(.gone), #answer .t").forEach(bindTile);
}
/* 言葉同士は半角スペースで区切り、つなぎ札の前後は詰める */
function joinTiles(ts){let s="";ts.forEach((t,i)=>{if(i&&t.tier!=="p"&&ts[i-1].tier!=="p")s+=" ";s+=t.w;});return s;}
function itemFrom(el){
  if(el.dataset.src==="pal")return {w:PALETTE[+el.dataset.pi],tier:"p",hi:null};
  const h=G.hands[G.turn][+el.dataset.hi];return {w:h.w,tier:h.tier,hi:+el.dataset.hi};
}
function canAdd(el){if(el.dataset.src==="pal"&&glueUsed()>=G.glue){toast(`つなぎ札は${G.glue}枚までです`);return false;}return true;}
function tapTile(el){
  if(el.dataset.src==="ans"){cur.splice(+el.dataset.ai,1);}
  else if(canAdd(el))cur.push(itemFrom(el));
  drawBuilder();
}
/* ドラッグ（マウス・タッチ共通） */
let drag=null;
function bindTile(el){
  el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapTile(el);}};
  el.onpointerdown=e=>{
    if(e.button>0)return;
    drag={el,x:e.clientX,y:e.clientY,moving:false,ghost:null,idx:null};
    el.setPointerCapture(e.pointerId);
  };
  el.onpointermove=e=>{
    if(!drag||drag.el!==el)return;
    if(!drag.moving){
      if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
      drag.moving=true;
      const g=el.cloneNode(true);g.classList.add("ghost-tile");g.removeAttribute("tabindex");document.body.appendChild(g);drag.ghost=g;
      el.classList.add("dragging");
    }
    drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
    const box=$("answer"),r=box.getBoundingClientRect();
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top-10&&e.clientY<=r.bottom+10;
    box.classList.toggle("over",inside);
    box.querySelector(".caret")?.remove();
    drag.idx=null;
    if(inside){
      const tiles=[...box.querySelectorAll(".t")].filter(t=>t!==el);
      let before=null;
      for(const t of tiles){const tr=t.getBoundingClientRect();
        if(e.clientY<tr.top||(e.clientY<=tr.bottom&&e.clientX<tr.left+tr.width/2)){before=t;break;}}
      const caret=document.createElement("span");caret.className="caret";
      if(before)box.insertBefore(caret,before);else box.appendChild(caret);
      box.querySelector(".empty")?.remove();
      drag.idx=before?+before.dataset.ai:cur.length;
    }
  };
  const end=e=>{
    if(!drag||drag.el!==el)return;
    const d=drag;drag=null;
    if(!d.moving){tapTile(el);return;}
    d.ghost.remove();
    if(el.dataset.src==="ans"){
      const from=+el.dataset.ai,item=cur[from];
      cur.splice(from,1);
      if(d.idx!=null){let to=d.idx;if(to>from)to--;cur.splice(to,0,item);}
    }else if(d.idx!=null&&canAdd(el)){cur.splice(d.idx,0,itemFrom(el));}
    drawBuilder();
  };
  el.onpointerup=end;
  el.onpointercancel=e=>{if(drag&&drag.el===el){drag.ghost?.remove();drag=null;drawBuilder();}};
}
function tick(){
  const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  const c=$("clock"),b=$("bar");if(!c)return;
  c.textContent=left;c.classList.toggle("low",left<=10);
  b.style.width=Math.max(0,(deadline-Date.now())/(G.limit*1000)*100)+"%";b.classList.toggle("low",left<=10);
  if(left<=0)submit(true);
}
function submit(timeout){
  stopTimer();
  if(drag){drag.ghost?.remove();drag=null;}
  G.answers[G.turn]={author:G.turn,tiles:cur.slice(),text:joinTiles(cur),used:cur.filter(c=>c.hi!=null).length,timeout};
  if(timeout)toast(`時間切れ。${name(G.turn)}さんの回答を提出しました`);
  G.turn++;
  if(G.turn<G.players.length)go("pass");else{G.order=shuffled(G.players.map((_,i)=>i));go("revealPass");}
}

/* ④ 発表（作者は伏せる） */
function revealPass(){
  $("screen").innerHTML=`<section class="sheet pass">
    <div class="who">全員そろいました</div>
    <p class="lead">端末をみんなが見える場所に置いてください。<br>作者名は伏せたまま、回答を発表します。</p>
    <button class="primary" id="open" type="button">回答を発表する</button>
  </section>`;
  $("open").onclick=()=>go("reveal");
}
function card(a,n,opts={}){
  const hand=G.hands[a.author],used=new Set(a.tiles.filter(t=>t.hi!=null).map(t=>t.hi));
  return `<article class="ans ${opts.cls||""}" data-i="${a.author}" ${opts.tab?'tabindex="0" role="button"':""}>
    <span class="num">回答 ${n}</span>
    <p class="body${a.text?"":" blank"}">${a.text?esc(a.text):"（時間内に作れませんでした）"}</p>
    <div class="tiles mini">${a.tiles.map(t=>tileHTML(t.w,t.tier)).join("")}</div>
    <span class="meta">手札${hand.length}枚中 ${a.used}枚を使用${a.timeout?"・時間切れ":""}</span>
    ${opts.showHand?`<div class="tiles mini">${hand.map((h,i)=>tileHTML(h.w,h.tier,used.has(i)?"":" unused")).join("")}</div>`:""}
    ${opts.extra||""}</article>`;
}
function reveal(){
  $("screen").innerHTML=`<section class="sheet">
    <div class="theme small"><span class="label">お題</span><span class="txt">${esc(G.theme)}</span></div>
    <p class="lead">作者は投票のあとで明かされます。</p>
    <div class="answers">${G.order.map((a,n)=>card(G.answers[a],n+1)).join("")}</div>
    <div class="row-flex"><button class="primary" id="tovote" type="button">投票に進む（${esc(name(0))}さんから）</button></div>
  </section>`;
  $("tovote").onclick=()=>{G.voter=0;G.votes=[];go("votePass");};
}

/* ⑤ 投票 */
function votePass(){
  $("screen").innerHTML=`<section class="sheet pass">
    <p class="label">投票 ${G.voter+1} / ${G.players.length}</p>
    <div class="who">${esc(name(G.voter))}さんの投票</div>
    <p class="lead">端末を${esc(name(G.voter))}さんに渡してください。<br>ほかの人に見えないように選びましょう。</p>
    <button class="primary" id="begin" type="button">投票する</button>
  </section>`;
  $("begin").onclick=()=>go("vote");
}
function vote(){
  let picked=null;
  $("screen").innerHTML=`<section class="sheet">
    <div><h2>${esc(name(G.voter))}さん、いちばん良かった回答は？</h2><p class="lead">${G.players.length===2?"2人対戦なので、自分の回答にも投票できます。":"自分の回答には投票できません。"}一つ選んで決定してください。</p></div>
    <div class="theme small"><span class="label">お題</span><span class="txt">${esc(G.theme)}</span></div>
    <div class="answers" id="vp">${G.order.map((a,n)=>card(G.answers[a],n+1,{cls:a===G.voter&&G.players.length>2?"self":"pickable",tab:!(a===G.voter&&G.players.length>2)})).join("")}</div>
    <div class="row-flex"><button class="primary" id="cast" type="button" disabled>この回答に決める</button></div>
  </section>`;
  const choose=el=>{const a=+el.dataset.i;picked=a;document.querySelectorAll("#vp .ans").forEach(x=>x.classList.toggle("picked",+x.dataset.i===a));$("cast").disabled=false;};
  document.querySelectorAll("#vp .pickable").forEach(el=>{el.onclick=()=>choose(el);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(el);}};});
  $("cast").onclick=()=>{
    G.votes[G.voter]=picked;G.voter++;
    if(G.voter<G.players.length)go("votePass");
    else{const c=tally(),m=Math.max(...c);c.forEach((v,i)=>{if(v===m)G.wins[name(i)]=(G.wins[name(i)]||0)+1;});G.round++;G.votes=[];G._last=c;go("result");}
  };
}
function tally(){const c=G.players.map(()=>0);G.votes.forEach(v=>c[v]++);return c;}

/* 結果（得票数だけを出し、誰が誰に入れたかは残さない） */
function result(){
  const c=G._last,m=Math.max(...c),win=c.map((v,i)=>v===m?i:-1).filter(i=>i>=0);
  const ranked=G.players.map((_,i)=>i).sort((a,b)=>c[b]-c[a]);
  $("screen").innerHTML=`<section class="sheet">
    <div class="champion"><p class="label">${win.length>1?"同点で優勝":"優勝"}</p>
      <div class="who">${win.map(i=>esc(name(i))).join("・")}</div><p class="lead">${m}票を集めました</p></div>
    <div class="theme small"><span class="label">お題</span><span class="txt">${esc(G.theme)}</span></div>
    <div class="answers">${ranked.map(a=>card(G.answers[a],G.order.indexOf(a)+1,{cls:c[a]===m?"win":"",showHand:true,
      extra:`<div class="foot"><span class="author">${esc(name(a))}</span><span class="votes">${c[a]}<small> 票</small></span></div>`})).join("")}</div>
    <p class="lead">${G.round}回戦が終わりました。通算の優勝回数は、ゲームをやめるときに発表します。</p>
    <div class="row-flex">
      <button class="primary" id="again" type="button">同じメンバーで次のお題へ</button>
      <button id="members" type="button">メンバーを変えて次のお題へ</button>
      <button id="end" type="button">ゲームをやめる</button>
    </div>
  </section>`;
  $("again").onclick=()=>{newTheme();go("odai");};
  $("members").onclick=()=>go("setup");
  $("end").onclick=()=>go("finale");
}

render();
</script>

</body>
